<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshLighter · Mesh Visualizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #02050a;
               font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
        #p5-container { width: 100vw; height: 100vh; }
        #viz-controls {
            position: fixed; top: 12px; left: 14px; z-index: 10;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 8px 12px; border: 1px solid #16324a; border-radius: 9px;
            background: rgba(4, 10, 18, 0.72); backdrop-filter: blur(4px);
            color: #9fd0e6; font-size: 12.5px;
        }
        .viz-brand { color: #cfe9f5; letter-spacing: .02em; }
        .viz-brand b { color: #33e1ff; }
        #viz-controls button {
            font: inherit; font-size: 12px; color: #d7ecf5; cursor: pointer;
            background: #0c2233; border: 1px solid #1d4763; border-radius: 6px; padding: 5px 11px;
        }
        #viz-controls button:hover:not(:disabled) { border-color: #33e1ff; color: #fff; }
        #viz-controls button:disabled { opacity: .45; cursor: not-allowed; }
        #viz-status { color: #7fb6cf; font-size: 11.5px; }
        .viz-passive { margin-left: auto; color: #4b93b0; font-size: 11px;
            border: 1px solid #16324a; border-radius: 20px; padding: 2px 9px; }
    </style>
</head>
<body>
    <div id="p5-container"></div>

    <div id="viz-controls">
        <span class="viz-brand">MeshLighter · <b>Mesh</b></span>
        <button id="viz-connect" type="button">Connect radio-pipe</button>
        <button id="viz-demo" type="button">Demo Mode</button>
        <span id="viz-status">idle</span>
        <span class="viz-passive" title="This visualizer only reads — it never transmits.">passive · read-only</span>
    </div>

    <!-- p5 (above) → decode → sketch (defines handleIncomingData) → source (drives it). -->
    <script src="mesh-decode.js"></script>
    <script src="sketch.js"></script>
    <script src="serial-source.js"></script>
</body>
</html>
