[env:nibble-zero-connect]
; pioarduino core (Arduino 3.x / IDF 5.x) — the default "espressif32" resolves to the
; frozen official 2.0.18 core (IDF 4.4) whose esp_partition_t lacks .erase_size, which
; nvdata.cpp needs. Pin pioarduino so the firmware builds on a current toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = waveshare_esp32_s3_zero
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2
    olikraus/U8g2@^2.36.2
build_flags =
    -D NIBBLE_ZERO
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I $PROJECT_DIR          ; so #include "boards/nibble_zero.h" resolves from firmware/
board_build.partitions = partitions.csv
