name: Deploy MeshLighter to Pages

on:
  push:
    branches: [main]
    paths:
      - 'MeshLighter/hud/**'
      - 'MeshLighter/python-lab/site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble clean site (browser surfaces only)
        run: |
          set -euo pipefail
          mkdir -p _site
          # Root is the Python Lab: the front door, with an intro and links to the rest.
          cp -r MeshLighter/python-lab/site/. _site/
          # The visualizer (Tactical HUD + Neural Mesh + Map over one model) lives under /viz/.
          cp -r MeshLighter/hud _site/viz
          touch _site/.nojekyll
          echo 'meshlighter.site' > _site/CNAME    # custom domain, kept across redeploys
          # The offensive CLI toolkit and local build cruft must never ship in the hosted site.
          rm -rf _site/toolkit _site/__pycache__
          # Keep the old /lab/ URL working (the lab is the root now).
          mkdir -p _site/lab
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=/"><a href="/">MeshLighter</a>' > _site/lab/index.html
          echo "Published tree:"; find _site -maxdepth 2 | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
