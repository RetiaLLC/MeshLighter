name: Deploy MeshLighter to Pages

on:
  push:
    branches: [main]
    paths:
      - 'MeshLighter/pages/**'
      - 'MeshLighter/Advanced_Visualizer/**'
      - 'MeshLighter/visualizer/**'
      - 'MeshLighter/python-lab/site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble clean site (browser surfaces only)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp MeshLighter/pages/index.html _site/index.html
          touch _site/.nojekyll
          cp -r MeshLighter/Advanced_Visualizer _site/neural-mesh
          cp -r MeshLighter/visualizer          _site/mesh
          cp -r MeshLighter/python-lab/site      _site/lab
          # Strip the Python server + any bundled toolkit from the PUBLISHED visualizers.
          # The visualizers are browser-native now; the offensive CLI must not ship in the site.
          rm -rf _site/neural-mesh/toolkit _site/mesh/toolkit
          rm -f  _site/neural-mesh/visual_server.py _site/neural-mesh/start_*.sh
          rm -f  _site/mesh/visual_server.py        _site/mesh/start_*.sh
          find _site/neural-mesh _site/mesh -name '*.py' -delete || true
          echo "Published tree:"; find _site -maxdepth 2 | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
