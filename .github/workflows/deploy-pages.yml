name: Deploy MeshLighter to Pages

on:
  push:
    branches: [main]
    paths:
      - 'MeshLighter/hud/**'
      - 'MeshLighter/python-lab/site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble clean site (browser surfaces only)
        run: |
          set -euo pipefail
          mkdir -p _site
          # Root drops straight into the visualizer (Tactical HUD + Neural Mesh over one model).
          cp -r MeshLighter/hud/. _site/
          # The Python lab (scripting + gated flasher) lives under /lab/.
          cp -r MeshLighter/python-lab/site _site/lab
          touch _site/.nojekyll
          echo 'meshlighter.site' > _site/CNAME    # custom domain, kept across redeploys
          # The offensive CLI toolkit must never ship in the hosted site.
          rm -rf _site/lab/toolkit
          echo "Published tree:"; find _site -maxdepth 2 | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
